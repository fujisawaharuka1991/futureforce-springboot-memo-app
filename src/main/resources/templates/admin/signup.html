<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
<title>新規登録</title>
</head>
<body>
	<div class="container">
	<main>
		<h1 class="app-title">新規登録</h1>
		
		<form th:action="@{/admin/signup}" th:object="${admin}" method="post">
			<div class="form-group">
				<label for="lastName">姓</label>
				<input type="text" th:field="*{lastName}" id="lastName" class="form-control" required>
				<div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="text-danger"></div>
			</div>
									
			<div class="form-group">
				<label for="firstName">名</label>
				<input type="text" th:field="*{firstName}" id="firstName" class="form-control" required>
			</div>
			<div class="form-group">
				<label for="email">email</label>
				<input type="text" th:field="*{email}" id="email" class="form-control" required>
			</div>
			<div class="form-group">
				<label for="password">パスワード</label>
				<input type="password" th:field="*{password}" id="password" class="form-control" required>
			</div>
			
			<div class="form-button-container">
			    <button type="submit" class="btn btn-primary">登録</button>
			</div>
			
			<div>
			    <span>アカウントをお持ちの場合は </span>
			     <a th:href="@{/admin/signin}">こちら</a>
			</div>
		</form>
	 </main>
	 </div>
</body>
</html>
